<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>Google</title>
	<style>
		*

		body {
			font-family: 'Helvetica Neue', Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			background: linear-gradient(to bottom right, #f0f4f8, #c9d6e9);
			color: #333;
			text-align: center;
			position: relative;
			overflow: hidden;
		}

		#message {
			font-size: 24px;
			font-weight: 500;
			margin-bottom: 20px;
			animation: fadeIn 1.0s ease-in-out;
		}

	
		@keyframes fadeIn {
			from {
				opacity: 0;
			}

			to {
				opacity: 1;
			}
		}
	</style>
</head>

<h1>読み込み中です...(すべてのAPIを稼働させています)

<body>
	<div id="message">読み込み中です...(すべてのAPIを稼働させています)</div>
	<canvas id="loadingCanvas"></canvas>
<p><button onclick="location.replace(location.href)">手動でリロード</button>
	<script>
		// ランダムメッセージの配列
        const messages = [
            "しばらくお待ちください...",
            "apiが固まっている場合どう仕様も無いです",
            "永遠に読み込めない場合は一度戻り再度進行してください"
        ];

        // ランダムなメッセージを表示する
        const randomMessage = messages[Math.floor(Math.random() * messages.length)];
        document.getElementById("message").innerText = randomMessage;

        // 2秒後にリダイレクト
        setTimeout(function() {
            location.reload();
        }, 2000);
	</script>
<script>
	setTimeout(function(){location.reload();},2000);
</script>
</body>

</html>
