<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>Google</title>
	<link rel="stylesheet" href="/css/font.css">
	<link rel="stylesheet" href="/css/styles.css">
</head>

<body>
	<header>
		<div class="banner">
		<a href="javascript:location.replace('/')">ホーム</a><br>
			
			<form class="d-flex" action="/s">
      </form>
				<button class="btn btn-link" style="position: absolute; right: 10px;" onclick="window.location.href='/help'">問い合わせ</button>
    </div>
	</header>
	<br><br>
	<h1>YouTubeのURLを入力</h1>
  <p>live配信は未対応です
	<form id="urlForm2">
		<input type="text" id="youtubeUrl" placeholder="YouTubeのURLを入力..." required>
		<button type="submit" name="action" value="watch">再生！</button>
		<button type="submit" name="action" value="comment">コメントのみを表示</button>
		<br><br>
</form>

		<script>
			document.getElementById('urlForm2').addEventListener('submit', function(event) {
        event.preventDefault();
        const url = document.getElementById('youtubeUrl').value;
        const videoId = extractVideoId(url);
        if (videoId) {
            const action = event.submitter.value;
            if (action === 'watch') {
                window.location.href = `/watch?v={videoId}`;
            } else if (action === 'comment') {
                <script>
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "/comments?v=" + getQueryValue('v'));
            xhr.onload = function () {      
                if (xhr.status == 200) {
                    const comments_div = document.getElementById('comments');
                    comments_div.innerHTML = xhr.responseText;

                    const comments_a_tags = comments_div.getElementsByTagName('a');

                    for(let i = 0; i < comments_a_tags.length; i++) {
                        const jump_time = comments_a_tags[i].getAttribute('data-jump-time')

                        if(jump_time) {
                            comments_a_tags[i].addEventListener('click', function(e) {
                                e.preventDefault()
                                player.currentTime = jump_time;
                            })
                        }
                    }
                } else { 
                    document.getElementById('comments').innerHTML = "コメントの読み込みに失敗しました。再読み込み等をお試し下さい。"; 
                }
            };
            xhr.send();
            } else {
                alert('Invalid action type');
            }
        } else {
            alert('Invalid YouTube URL');
        }
    });

    function extractVideoId(url) {
        const regExp = /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[1].length == 11) ? match[1] : null;
    }
		</script>
</body>

</html>
