<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>Gppgle</title>
	<link rel="stylesheet" href="/css/font.css">
	<link rel="stylesheet" href="/css/styles.css">
</head>

<body>
	<header>
		<div class="banner">
		<a href="javascript:location.replace('/')">ホーム</a><br>
			
			<form class="d-flex" action="/s">
      </form>
				<button class="btn btn-link" style="position: absolute; right: 10px;" onclick="window.location.href='/help'">問い合わせ</button>
    </div>
	</header>
	<br><br>
	<h1>YouTubeのURLから視聴!</h1>
  <p>↓ここにurlを入力してください↓(live配信は未対応です)<p>
	<form id="urlForm2">
		<input type="text" id="youtubeUrl" placeholder="YouTubeのURLを入力..." required>
		<button type="submit" name="action" value="watch">再生！</button>
		<br><br>
</form>

		<script>
			document.getElementById('urlForm2').addEventListener('submit', function(event) {
        event.preventDefault();
        const url = document.getElementById('youtubeUrl').value;
        const videoId = extractVideoId(url);
        if (videoId) {
            const action = event.submitter.value;
            if (action === 'watch') {
                window.location.href = `/w/${videoId}`;
            } else {
                alert('Invalid action type');
            }
        } else {
            alert('Invalid YouTube URL');
        }
    });

    function extractVideoId(url) {
        const regExp = /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[1].length == 11) ? match[1] : null;
    }
		</script>
</body>

</html>
