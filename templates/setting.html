<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Google</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      font-size: 1.4em;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .btn-secondary {
      background-color: #34a853;
      margin-top: 10px;
    }
    a {
      display: inline-block;
      margin-bottom: 20px;
      color: #4285f4;
      text-decoration: none;
    }
    p {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <a href="javascript:location.replace('/')">ホーム</a>

  <div class="card">
    <h1>再生モードを選択してください</h1>
    <form action="/set-mode" method="post">
      <label><input type="radio" name="play_mode" value="watch" {% if play_mode == 'watch' %}checked{% endif %}> デフォルトモード</label>
      <label><input type="radio" name="play_mode" value="embed" {% if play_mode == 'embed' %}checked{% endif %}> 埋め込みモード(公式)</label>
      <label><input type="radio" name="play_mode" value="nocookie" {% if play_mode == 'nocookie' %}checked{% endif %}> 埋め込みモード(NoCookie)</label>
      <label><input type="radio" name="play_mode" value="w" {% if play_mode == 'w' %}checked{% endif %}> 画質調整モード</label>
      <br><br>
      <button type="submit">保存</button>
    </form>
  </div>

  <div class="card">
    <h1>about:blankで開く</h1>
    <p>現在のページを新しいウィンドウの <code>about:blank</code> 上に開いて利用できます。</p>
    <button class="btn-secondary" onclick="openInBlank()">開く</button>
  </div>

  <script>
    function openInBlank() {
      const siteUrl = location.href;
      const win = window.open("about:blank", "_blank");
      win.document.write(`
        <html>
          <head>
            <title>about:blank</title>
            <style>
              body, html {
                margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
              }
              iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
            </style>
          </head>
          <body>
            <iframe src="${siteUrl}" allowfullscreen></iframe>
          </body>
        </html>
      `);
      win.document.close();
    }
  </script>

</body>
</html>
