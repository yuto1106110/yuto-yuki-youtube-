<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Google</title>
</head>
<body>
  <h2>再生方式の設定</h2>
  <p>再生ページ（/watch）でどの方式を使うかを選択してください。</p>

  <label for="playModeSelect">再生モード:</label>
  <select id="playModeSelect">
    <option value="watch">通常再生</option>
    <option value="embed">公式埋め込み</option>
    <option value="nocookie">埋め込み（NoCookie）</option>
    <option value="w">高画質再生</option>
  </select>

  <p>※選択はクッキーに保存され、1年間有効です。</p>

  <script>
    const select = document.getElementById("playModeSelect");

    const match = document.cookie.match(/(?:^|;) ?play_mode=([^;]*)/);
    if (match) select.value = match[1];

    select.addEventListener("change", () => {
      document.cookie = `play_mode=${select.value}; path=/; max-age=31536000`;
      alert("保存しました。次回以降 /watch で反映されます。");
    });
  </script>
</body>
</html>
