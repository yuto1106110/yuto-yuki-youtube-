<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フォイチャット</title>
  <style>
    body { margin: 0; font-family: sans-serif; overflow: hidden; }
    #chat-container { display: flex; height: 100vh; }
    #sidebar {
      width: 250px; background: #222; color: white; transition: transform 0.3s ease;
      transform: translateX(-100%); position: fixed; top: 0; left: 0; height: 100vh; z-index: 2;
    }
    #sidebar.open { transform: translateX(0); }
    #hamburger { position: fixed; top: 10px; left: 10px; z-index: 3; }
    #main {
      margin-left: 0; flex: 1; display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    #messages {
      flex: 1; overflow-y: scroll; padding: 1rem;
      background: #f0f0f0;
    }
    #input-container {
      position: sticky; bottom: 0; background: white; padding: 0.5rem;
      display: flex; border-top: 1px solid #ccc;
    }
    #input-container input { flex: 1; padding: 0.5rem; }
    #scroll-to-bottom {
      position: absolute; right: 20px; bottom: 80px;
      background: #333; color: white; border: none; padding: 5px 10px;
      display: none;
    }
  </style>
</head>
<body>
  <button id="hamburger">☰</button>
  <div id="sidebar">
    <h2>メニュー</h2>
    <ul>
      <li><button onclick="showChat()">チャット</button></li>
      <li><button onclick="showReports()">通報履歴</button></li>
    </ul>
  </div>
  <div id="chat-container">
    <div id="main">
      <div id="messages"></div>
      <button id="scroll-to-bottom">一番下へ</button>
      <div id="input-container">
        <input type="text" id="messageInput" placeholder="メッセージを入力..." />
        <button onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getDatabase, ref, onChildAdded, push, set, remove, get, onValue
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
      authDomain: "eviter-chat.firebaseapp.com",
      databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
      projectId: "eviter-chat",
      storageBucket: "eviter-chat.appspot.com",
      messagingSenderId: "838666832539",
      appId: "1:838666832539:web:3471b7b5f83a140eda543e",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const messagesRef = ref(db, "chatroom/messages");

    const uid = localStorage.getItem("uid") || crypto.randomUUID();
    const deviceId = localStorage.getItem("deviceId") || crypto.randomUUID();
    localStorage.setItem("uid", uid);
    localStorage.setItem("deviceId", deviceId);

    const username = prompt("名前を入力してください（例: Yuto-110）");
    const email = `${username}@dummy.com`;
    localStorage.setItem("username", username);

    const messagesDiv = document.getElementById("messages");
    const scrollButton = document.getElementById("scroll-to-bottom");

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value;
      if (!text.trim()) return;
      push(messagesRef, {
        uid,
        username,
        deviceId,
        text,
        timestamp: Date.now(),
      });
      input.value = "";
    }

    onChildAdded(messagesRef, (snapshot) => {
      const msg = snapshot.val();
      const msgEl = document.createElement("div");
      msgEl.textContent = `${msg.username}: ${msg.text}`;
      messagesDiv.appendChild(msgEl);
      if (isAtBottom()) messagesDiv.scrollTop = messagesDiv.scrollHeight;
      else scrollButton.style.display = "block";
    });

    function isAtBottom() {
      return messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 10;
    }

    scrollButton.addEventListener("click", () => {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      scrollButton.style.display = "none";
    });

    document.getElementById("hamburger").onclick = () => {
      document.getElementById("sidebar").classList.toggle("open");
    };

    function showChat() {
      alert("チャット表示");
      // ページ切替の処理など必要であればここに追加
    }

    function showReports() {
      alert("通報履歴表示（未実装）");
    }

    // 毎日0時にメッセージ全削除（簡易版）
    const midnightCheck = setInterval(() => {
      const now = new Date();
      if (now.getHours() === 0 && now.getMinutes() === 0) {
        remove(messagesRef);
      }
    }, 60000);
  </script></body>
</html>
