    <!-- 動きのある CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff;
        }

        /* 入力エリア用スタイル */
        textarea {
            margin: 5px;
            padding: 10px;
            width: calc(100% - 22px);
            height: 70px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            resize: vertical;
        }

        /* チャットボックス */
        #chat-box {
            border: 1px solid #ccc;
            height: 350px;
            overflow-y: scroll;
            padding: 0px;
            margin-bottom: 10px;
            background: #f9f9f9;
            animation: backgroundPulse 10s ease infinite;
            background-size: 200% 200%;
        }

        /* チャットメッセージのフェードイン */
        .message {
            padding: 5px 0;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
            display: flex;
            max-width: 2000px;
            margin-bottom: 10px;
            padding: .8em 1.2em;
            border-radius: 5px;
            background-color: #f2f2f2;
            color: #333333;
        }

        .message-time {
            font-size: 0.8em;
            color: gray;
            margin-left: 5px;
        }

        /* アニメーション定義 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes backgroundPulse {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ボタンのスタイル */
        button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        /* サインアップ／ログインおよびチャットエリアの読み込みアニメーション */
        #user-auth,
        #chat-section {
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 虹色の名前（管理者と同等の演出） */
        .rainbow-name {
            background: linear-gradient(45deg, gold, silver, gray);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 5s linear infinite;
        }

        @keyframes rainbow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 入力フィールドのフォーカス時エフェクト */
        textarea:focus,
        #signupName:focus,
        #signupPassword:focus,
        #loginName:focus,
        #loginPassword:focus {
            outline: none;
            border: 1px solid #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
            transition: box-shadow 0.3s ease, border 0.3s ease;
        }
    </style>
