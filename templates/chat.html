<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eviter Chat</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f9f9f9;
    }
    #inputArea {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      display: flex;
      padding: 10px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }
    #messageInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    #sendBtn {
      padding: 10px 20px;
    }
    #scrollToBottom {
      position: fixed;
      bottom: 60px;
      right: 20px;
      display: none;
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>  <div id="messages"></div><button id="scrollToBottom">最新メッセージへ</button>

  <div id="inputArea">
    <input id="messageInput" type="text" placeholder="メッセージを入力…">
    <button id="sendBtn">送信</button>
  </div>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, remove, get, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
      authDomain: "eviter-chat.firebaseapp.com",
      databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
      projectId: "eviter-chat",
      storageBucket: "eviter-chat.appspot.com",
      messagingSenderId: "838666832539",
      appId: "1:838666832539:web:3471b7b5f83a140eda543e",
      measurementId: "G-R5X3J61343"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const messagesRef = ref(db, 'messages');
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const scrollToBottomBtn = document.getElementById('scrollToBottom');

    let autoScroll = true;

    function scrollToBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    messagesDiv.addEventListener('scroll', () => {
      const atBottom = messagesDiv.scrollTop + messagesDiv.clientHeight >= messagesDiv.scrollHeight - 50;
      autoScroll = atBottom;
      scrollToBottomBtn.style.display = atBottom ? 'none' : 'block';
    });

    scrollToBottomBtn.addEventListener('click', () => {
      scrollToBottom();
    });

    sendBtn.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;
      const msg = {
        text,
        createdAt: Date.now()
      };
      push(messagesRef, msg);
      input.value = '';
    });

    onChildAdded(messagesRef, (snapshot) => {
      const msg = snapshot.val();
      const div = document.createElement('div');
      div.textContent = msg.text;
      messagesDiv.appendChild(div);
      if (autoScroll) scrollToBottom();
    });

    // 毎日0時にメッセージを全削除（クライアント側）
    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() < 10) {
        remove(messagesRef);
      }
    }, 5000);

  </script></body>
</html>
