<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eviter Chat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 250px;
      background-color: #222;
      color: white;
      padding: 10px;
      display: none;
      flex-direction: column;
    }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f0f0f0;
    }
    #input {
      display: flex;
      padding: 10px;
      background-color: white;
      position: sticky;
      bottom: 0;
    }
    #input input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    #input button {
      padding: 10px 20px;
    }
    .message {
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }
    .meta {
      font-weight: bold;
    }
    .timestamp {
      font-size: 0.8em;
      color: #666;
      margin-left: 5px;
    }
    #scrollBtn {
      position: fixed;
      bottom: 70px;
      right: 20px;
      display: none;
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 50%;
      font-size: 20px;
    }
    #hamburger {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #333;
      color: white;
      border: none;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <p>サイドバー</p>
    <!-- 通報履歴など切り替え項目ここに追加予定 -->
  </div>  <div id="main">
    <button id="hamburger">☰</button>
    <div id="chat"></div>
    <div id="input">
      <input type="text" id="messageInput" placeholder="メッセージを入力...">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>
  <button id="scrollBtn" onclick="scrollToBottom()">↓</button>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
      authDomain: "eviter-chat.firebaseapp.com",
      databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
      projectId: "eviter-chat",
      storageBucket: "eviter-chat.appspot.com",
      messagingSenderId: "838666832539",
      appId: "1:838666832539:web:3471b7b5f83a140eda543e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'messages');

    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const scrollBtn = document.getElementById('scrollBtn');
    let isAtBottom = true;
    const userName = prompt("名前を入力してください") || "名無し";

    document.getElementById('hamburger').onclick = () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.style.display = sidebar.style.display === 'flex' ? 'none' : 'flex';
    };

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      push(chatRef, {
        name: userName,
        text,
        time: new Date().toLocaleTimeString()
      });
      input.value = "";
    }

    onChildAdded(chatRef, (data) => {
      const { name, text, time } = data.val();
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerHTML = `<div class="meta">${name}<span class="timestamp">${time}</span></div><div>${text}</div>`;
      chat.appendChild(msg);
      if (isAtBottom) chat.scrollTop = chat.scrollHeight;
    });

    chat.addEventListener('scroll', () => {
      const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 50;
      isAtBottom = nearBottom;
      scrollBtn.style.display = nearBottom ? 'none' : 'block';
    });

    window.scrollToBottom = () => {
      chat.scrollTop = chat.scrollHeight;
    };
  </script></body>
</html>
