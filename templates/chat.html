<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オープンチャット</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    #login, #chat { display: none; padding: 20px; }
    #messages { max-height: 300px; overflow-y: auto; background: white; padding: 10px; border: 1px solid #ccc; margin-bottom: 10px; }
    .message { padding: 5px; border-bottom: 1px solid #eee; position: relative; }
    .report-btn { position: absolute; right: 5px; top: 5px; font-size: 12px; }
    #adminPanel, #adminManager { display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

<h1 style="text-align:center;">オープンチャット</h1>

<div id="login">
  <h3>ログイン / 登録</h3>
  名前: <input id="name"><br>
  パスワード: <input id="password" type="password"><br>
  <button id="registerBtn">登録</button>
  <button id="loginBtn">ログイン</button>
</div>

<div id="chat">
  <div id="userInfo"></div>
  <div id="messages"></div>
  <input id="msgInput" placeholder="メッセージを入力"><button id="sendBtn">送信</button>

  <div id="adminPanel">
    <h4>通報履歴</h4>
    <div id="reportList"></div>
    <h4>BAN管理</h4>
    <div id="banList"></div>
  </div>

  <div id="adminManager">
    <h4>管理者追加/削除</h4>
    UID: <input id="adminUid"><br>
    <button id="addAdminBtn">追加</button>
    <button id="removeAdminBtn">削除</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, remove, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
  authDomain: "eviter-chat.firebaseapp.com",
  databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
  projectId: "eviter-chat",
  storageBucket: "eviter-chat.appspot.com",
  messagingSenderId: "838666832539",
  appId: "1:838666832539:web:3471b7b5f83a140eda543e",
  measurementId: "G-R5X3J61343"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const loginDiv = document.getElementById("login");
const chatDiv = document.getElementById("chat");
const registerBtn = document.getElementById("registerBtn");
const loginBtn = document.getElementById("loginBtn");
const nameInput = document.getElementById("name");
const passInput = document.getElementById("password");

let currentUser, isOwner = false, isAdmin = false;

onAuthStateChanged(auth, async user => {
  if (!user) {
    loginDiv.style.display = "block";
    return;
  }
  currentUser = user;
  await updateProfile(user, { displayName: nameInput.value || user.displayName });

  isOwner = user.displayName === "Yuto-110";
  const adminSnap = await get(ref(db, `admins/${user.uid}`));
  isAdmin = adminSnap.exists();

  if (isOwner || isAdmin) {
    document.getElementById("adminPanel").style.display = "block";
    loadReportList();
    loadBanList();
    if (isOwner) {
      document.getElementById("adminManager").style.display = "block";
    }
  }

  document.getElementById("userInfo").textContent = `ようこそ ${user.displayName}`;
  loginDiv.style.display = "none";
  chatDiv.style.display = "block";
  checkBan();
  loadMessages();
  cleanOldReports();
  registerDeviceInfo();
});

registerBtn.onclick = () => {
  const name = nameInput.value.trim();
  const pass = passInput.value.trim();
  const email = name + "@chat.local";
  createUserWithEmailAndPassword(auth, email, pass)
    .then(cred => updateProfile(cred.user, { displayName: name }));
};

loginBtn.onclick = () => {
  const email = nameInput.value.trim() + "@chat.local";
  signInWithEmailAndPassword(auth, email, passInput.value.trim());
};

document.getElementById("sendBtn").onclick = () => {
  const text = document.getElementById("msgInput").value;
  if (!text) return;
  push(ref(db, "messages"), {
    uid: currentUser.uid,
    name: currentUser.displayName,
    text,
    time: Date.now()
  });
  document.getElementById("msgInput").value = "";
};

function loadMessages() {
  const msgRef = ref(db, "messages");
  onChildAdded(msgRef, snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.className = "message";
    div.innerHTML = `<b>${m.name}</b>: ${m.text} <button class="report-btn" onclick="reportMessage('${snap.key}')">通報</button>`;
    document.getElementById("messages").appendChild(div);
  });
}

window.reportMessage = (msgId) => {
  const now = Date.now();
  const uid = currentUser.uid;
  const reportRef = ref(db, `reports/${msgId}/${uid}`);
  set(reportRef, { reportedAt: now });

  get(ref(db, `reports/${msgId}`)).then(snap => {
    const reports = snap.val();
    if (reports && Object.keys(reports).length >= 3) {
      remove(ref(db, `messages/${msgId}`));
      remove(ref(db, `reports/${msgId}`));
    }
  });
};

function cleanOldReports() {
  get(ref(db, "reports")).then(snap => {
    const now = Date.now();
    snap.forEach(msgSnap => {
      msgSnap.forEach(userSnap => {
        const t = userSnap.val().reportedAt;
        if (now - t > 3 * 86400000) {
          remove(ref(db, `reports/${msgSnap.key}/${userSnap.key}`));
        }
      });
    });
  });
}

function loadReportList() {
  get(ref(db, "reports")).then(snap => {
    const out = [];
    snap.forEach(msgSnap => {
      out.push(`<div>${msgSnap.key}: ${Object.keys(msgSnap.val()).length}件</div>`);
    });
    document.getElementById("reportList").innerHTML = out.join("");
  });
}

function getDeviceId() {
  let id = localStorage.getItem("device_id");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }
  return id;
}

async function getIP() {
  const res = await fetch("https://api.ipify.org?format=json");
  const json = await res.json();
  return json.ip;
}

async function registerDeviceInfo() {
  const id = getDeviceId();
  const ip = await getIP();
  set(ref(db, `devices/${id}`), {
    uid: currentUser.uid,
    ip: ip
  });
}

async function checkBan() {
  const id = getDeviceId();
  const banSnap = await get(ref(db, `bannedDevices/${id}`));
  if (banSnap.exists()) {
    alert("この端末はBANされています");
    location.reload();
  }
}

function loadBanList() {
  get(ref(db, "devices")).then(snap => {
    const out = [];
    snap.forEach(d => {
      const id = d.key;
      const { uid, ip } = d.val();
      out.push(`<div>${id} (IP: ${ip}) <button onclick="banDevice('${id}')">BAN</button></div>`);
    });
    document.getElementById("banList").innerHTML = out.join("");
  });
}

window.banDevice = (id) => {
  if (!isAdmin && !isOwner) return;
  set(ref(db, `bannedDevices/${id}`), true);
};

document.getElementById("addAdminBtn").onclick = () => {
  const uid = document.getElementById("adminUid").value.trim();
  if (isOwner) set(ref(db, `admins/${uid}`), true);
};

document.getElementById("removeAdminBtn").onclick = () => {
  const uid = document.getElementById("adminUid").value.trim();
  if (isOwner) remove(ref(db, `admins/${uid}`));
};
</script>

</body>
</html>
