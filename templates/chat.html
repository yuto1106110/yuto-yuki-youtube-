<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャットアプリ</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; }
        #messages { flex: 1; overflow-y: scroll; }
        #input-container { display: flex; }
        #message-input { flex: 1; }
        .message { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        .message .timestamp { font-size: 0.8em; color: #666; }
        .sidebar { width: 250px; background-color: #f4f4f4; position: fixed; top: 0; left: 0; height: 100%; display: none; }
        .sidebar ul { list-style-type: none; padding: 10px; }
        .sidebar ul li { padding: 10px; border-bottom: 1px solid #ccc; }
        #sidebar-toggle { cursor: pointer; position: fixed; top: 20px; left: 10px; }
        .login-form { display: none; }
    </style>
</head>
<body>

    <div id="sidebar-toggle">☰</div>
    <div class="sidebar" id="sidebar">
        <ul>
            <li id="view-messages">メッセージ</li>
            <li id="view-reports">通報履歴</li>
        </ul>
    </div>

    <div id="chat-container">
        <div id="messages"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="メッセージを入力...">
            <button id="send-btn">送信</button>
        </div>
    </div>

    <!-- ログインフォーム -->
    <div id="login-form" class="login-form">
        <h3>ログイン</h3>
        <input type="text" id="username" placeholder="ユーザー名">
        <input type="password" id="password" placeholder="パスワード">
        <button id="login-btn">ログイン</button>
        <button id="guest-login-btn">ゲストログイン</button>
    </div>

    <!-- Firebase 初期化 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
            authDomain: "eviter-chat.firebaseapp.com",
            databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
            projectId: "eviter-chat",
            storageBucket: "eviter-chat.appspot.com",
            messagingSenderId: "838666832539",
            appId: "1:838666832539:web:3471b7b5f83a140eda543e",
            measurementId: "G-R5X3J61343"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;

        // サイドバーの折りたたみ
        document.getElementById("sidebar-toggle").addEventListener("click", () => {
            const sidebar = document.getElementById("sidebar");
            sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
        });

        // メッセージ表示
        function displayMessages() {
            db.ref("messages").once("value", snapshot => {
                const messagesContainer = document.getElementById("messages");
                messagesContainer.innerHTML = "";
                snapshot.forEach(childSnapshot => {
                    const message = childSnapshot.val();
                    const div = document.createElement("div");
                    div.classList.add("message");
                    div.innerHTML = `<strong>${message.username}</strong> <span class="timestamp">${message.timestamp}</span><p>${message.text}</p>`;
                    messagesContainer.appendChild(div);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // メッセージ送信
        document.getElementById("send-btn").addEventListener("click", () => {
            const text = document.getElementById("message-input").value;
            if (text && currentUser) {
                const timestamp = new Date().toLocaleString();
                db.ref("messages").push({
                    username: currentUser.username,
                    text: text,
                    timestamp: timestamp
                });
                document.getElementById("message-input").value = "";
            }
        });

        // ログイン処理
        document.getElementById("login-btn").addEventListener("click", () => {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            auth.createUserWithEmailAndPassword(`${username}@chat.com`, password)
                .then(userCredential => {
                    currentUser = { username: username, uid: userCredential.user.uid };
                    document.getElementById("login-form").style.display = 'none';
                    displayMessages();
                })
                .catch(error => alert(error.message));
        });

        // ゲストログイン
        document.getElementById("guest-login-btn").addEventListener("click", () => {
            const username = `#${Math.floor(Math.random() * 10000)}`;
            currentUser = { username: username, uid: `guest-${Date.now()}` };
            document.getElementById("login-form").style.display = 'none';
            displayMessages();
        });

        // アプリ初期化時にログインフォーム表示
        window.onload = () => {
            if (!currentUser) {
                document.getElementById("login-form").style.display = 'block';
            } else {
                displayMessages();
            }
        };
    </script>

</body>
</html>
