<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eviter Chat</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, remove, get, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";const firebaseConfig = {
  apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
  authDomain: "eviter-chat.firebaseapp.com",
  databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
  projectId: "eviter-chat",
  storageBucket: "eviter-chat.appspot.com",
  messagingSenderId: "838666832539",
  appId: "1:838666832539:web:3471b7b5f83a140eda543e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const uid = localStorage.getItem("deviceUid") || crypto.randomUUID();
localStorage.setItem("deviceUid", uid);

function getIP() {
  fetch('https://api.ipify.org?format=json')
    .then(res => res.json())
    .then(data => localStorage.setItem("userIP", data.ip));
}
getIP();

let currentUser = null;
let username = "";
let isAdmin = false;
let isOwner = false;

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    const name = user.email.split('@')[0];
    username = name;
    isOwner = name === 'Yuto-110';
    checkAdmin(name);
    loadMessages();
    loadReports();
  }
});

async function checkAdmin(name) {
  const adminRef = ref(db, 'admins/' + name);
  const snapshot = await get(adminRef);
  isAdmin = snapshot.exists();
}

window.register = async function register() {
  const name = prompt("名前を入力:");
  const pass = prompt("パスワードを設定:");
  const email = name + "@eviter.chat";
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    if (name === "Yuto-110") {
      set(ref(db, 'admins/Yuto-110'), true);
    }
  } catch (e) {
    alert(e.message);
  }
}

window.login = async function login() {
  const name = prompt("名前:");
  const pass = prompt("パスワード:");
  const email = name + "@eviter.chat";
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    alert(e.message);
  }
}

window.sendMessage = function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !currentUser) return;
  const msgRef = ref(db, 'messages');
  push(msgRef, {
    name: username,
    text,
    time: Date.now(),
    uid,
    ip: localStorage.getItem("userIP") || ""
  });
  input.value = '';
}

function loadMessages() {
  const msgRef = ref(db, 'messages');
  onChildAdded(msgRef, snapshot => {
    const data = snapshot.val();
    if (bannedDevices.includes(data.uid)) return;
    const box = document.createElement('div');
    box.className = 'message-box';
    const msg = document.createElement('div');
    msg.className = 'message';
    msg.textContent = `${data.name}: ${data.text}`;

    const reportBtn = document.createElement('button');
    reportBtn.textContent = '通報';
    reportBtn.onclick = () => reportMessage(snapshot.key, data);

    box.appendChild(msg);
    box.appendChild(reportBtn);
    document.getElementById('messages').appendChild(box);
  });
}

function reportMessage(id, data) {
  const reportRef = ref(db, 'reports/' + id + '/' + uid);
  set(reportRef, {
    reporter: username,
    time: Date.now(),
    target: data
  });
}

function loadReports() {
  const reportView = document.getElementById('reports');
  const reportRef = ref(db, 'reports');
  onChildAdded(reportRef, snap => {
    const msgReports = snap.val();
    const keys = Object.keys(msgReports);
    const box = document.createElement('div');
    box.textContent = `通報対象: ${msgReports[keys[0]].target.text}`;

    if (isAdmin || isOwner) {
      const delBtn = document.createElement('button');
      delBtn.textContent = '削除';
      delBtn.onclick = () => {
        remove(ref(db, 'messages/' + snap.key));
        remove(ref(db, 'reports/' + snap.key));
      };

      const banBtn = document.createElement('button');
      banBtn.textContent = 'BAN';
      banBtn.onclick = () => {
        set(ref(db, 'banned/' + msgReports[keys[0]].target.uid), true);
      };

      box.appendChild(delBtn);
      box.appendChild(banBtn);
    }
    reportView.appendChild(box);
  });
}

let bannedDevices = [];
const banRef = ref(db, 'banned');
onChildAdded(banRef, snap => {
  bannedDevices.push(snap.key);
});

  </script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 200px;
      background: #2c3e50;
      color: white;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .sidebar button {
      background: none;
      color: white;
      border: none;
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #34495e;
      color: white;
      padding: 10px;
      text-align: center;
    }
    .content {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }
    .message-box {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }
    .message {
      background: #ecf0f1;
      border-radius: 10px;
      padding: 8px;
      margin: 2px 0;
      max-width: 70%;
    }
    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    .input-area input {
      flex: 1;
      padding: 8px;
    }
    .input-area button {
      padding: 8px 12px;
      margin-left: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="showView('chat')">チャット</button>
    <button onclick="showView('reports')">通報履歴</button>
    <button onclick="register()">登録</button>
    <button onclick="login()">ログイン</button>
  </div>
  <div class="main">
    <div class="header">Eviter Chat</div>
    <div id="chat" class="content">
      <div id="messages"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="メッセージを入力...">
        <button onclick="sendMessage()">送信</button>
      </div>
    </div>
    <div id="reports" class="content hidden">通報履歴エリア</div>
  </div>  <script>
    function showView(id) {
      document.querySelectorAll('.content').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
  </script></body>
</html>
