<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フォイチャット</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 250px; background: #222; color: white; padding: 10px; display: none; flex-direction: column; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; background: #f0f0f0; }
    #inputArea { display: flex; padding: 10px; background: #ddd; position: sticky; bottom: 0; }
    #messageInput { flex: 1; padding: 5px; }
    #scrollButton { position: absolute; bottom: 60px; right: 20px; display: none; }
    #hamburger { background: #222; color: white; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="sidebar">
    <button onclick="switchView('chat')">チャット</button>
    <button onclick="switchView('reports')">通報履歴</button>
    <button onclick="switchView('users')">ユーザー管理</button>
  </div>
  <div id="main">
    <div id="hamburger" onclick="toggleSidebar()">≡</div>
    <div id="messages"></div>
    <button id="scrollButton" onclick="scrollToBottom()">↓ 下まで</button>
    <div id="inputArea">
      <input id="messageInput" placeholder="メッセージを入力..." />
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { getDatabase, ref, push, onChildAdded, remove, set, get, child } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7m86dWHVcNF_rZBVSS15WWwRre2NAYlk",
      authDomain: "eviter-chat.firebaseapp.com",
      databaseURL: "https://eviter-chat-default-rtdb.firebaseio.com",
      projectId: "eviter-chat",
      storageBucket: "eviter-chat.appspot.com",
      messagingSenderId: "838666832539",
      appId: "1:838666832539:web:3471b7b5f83a140eda543e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUID = null;
    let username = localStorage.getItem('username') || prompt("名前を入力:");
    localStorage.setItem('username', username);

    const email = `${username}@eviter-chat.app`;
    const password = localStorage.getItem('password') || prompt("パスワードを入力:");
    localStorage.setItem('password', password);

    signInWithEmailAndPassword(auth, email, password)
      .catch(() => createUserWithEmailAndPassword(auth, email, password))
      .then(() => console.log("ログイン/登録成功"));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUID = user.uid;
        setupChat();
      }
    });

    function setupChat() {
      const messagesRef = ref(db, 'messages');
      onChildAdded(messagesRef, (snap) => {
        const data = snap.val();
        const div = document.createElement('div');
        div.textContent = `${data.name}: ${data.text}`;
        document.getElementById('messages').appendChild(div);
        handleScroll();
      });
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      if (input.value.trim() === '') return;
      const messagesRef = ref(db, 'messages');
      push(messagesRef, {
        uid: currentUID,
        name: username,
        text: input.value,
        timestamp: Date.now()
      });
      input.value = '';
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.style.display = sb.style.display === 'flex' ? 'none' : 'flex';
    }

    function switchView(view) {
      alert(`${view}画面へ切り替えます（未実装）`);
    }

    function scrollToBottom() {
      const msg = document.getElementById('messages');
      msg.scrollTop = msg.scrollHeight;
    }

    function handleScroll() {
      const msg = document.getElementById('messages');
      const isBottom = msg.scrollHeight - msg.scrollTop <= msg.clientHeight + 20;
      if (isBottom) {
        scrollToBottom();
        document.getElementById('scrollButton').style.display = 'none';
      } else {
        document.getElementById('scrollButton').style.display = 'block';
      }
    }
  </script></body>
</html>
