<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>【ウェザーニュース】天気 - 台風・地震・防災情報｜予報精度No.1</title>
	<style>
		body,
		html {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
		}

		iframe {
			width: 100%;
			height: 85%;
			border: none;
		}

	.cookie-notice {
	max-width: 100%;
	background-color: rgba(0, 0, 0, 0.8);
	color: #fff;
	padding: 5px;
	border-radius: 5px;
	box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
	text-align: center;
	z-index: 1000;
	opacity: 0;
	transform: translateY(20px);
	transition: opacity 0.5s ease, transform 0.5s ease;
	}
	
	.cookie-notice button {
	background-color: #007bff;
	color: #fff;
	border: none;
	padding: 10px 20px;
	margin: 5px;
	border-radius: 3px;
	cursor: pointer;
	font-size: 14px;
	transition: background-color 0.3s ease;
	}
	
	.cookie-notice button:hover {
	background-color: #0056b3;
	}
	
	@media (max-width: 600px) {
	.cookie-notice {
	bottom: 10px;
	right: 10px;
	max-width: 100%;
	font-size: 14px;
	padding: 10px;
	}
	
	.cookie-notice button {
	padding: 8px 16px;
	font-size: 12px;
	}
	}
	</style>
</head>

<body>
	<iframe
		src="https://weathernews.jp/"
		title="【ウェザーニュース】天気 - 台風・地震・防災情報｜予報精度No.1
"></iframe>

			<!-- Cookieの承認 -->
			<div id="cookie-notice" class="cookie-notice">
				このサイトではクッキーを使用しています。<br>
				<button id="accept-btn">承認する</button>
				<button id="reject-btn">拒否する</button>
			</div>
			<script src="scripts.js"></script>
</body>

</html>
